    # Day 14 projection overlay, appended to the stock cvat_ui server block by overlay.sh:
    # the public plugin file, and the private calibration config served only to a logged-in
    # CVAT session (auth_request -> cvat_server /api/users/self).

    location /d14-overlay/ {
        alias /usr/share/nginx/d14-overlay/;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Resource-Policy "same-origin";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /d14-overlay/private/config.json {
        auth_request /d14-overlay-auth;
        alias /usr/share/nginx/d14-overlay-private/config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Cross-Origin-Resource-Policy "same-origin";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /d14-overlay-auth {
        internal;
        # resolve at request time so cvat_ui still starts when cvat_server is down
        resolver 127.0.0.11 valid=30s;
        set $cvat_self http://cvat_server:8080/api/users/self;
        proxy_pass $cvat_self;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }
